<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBORG QUANT ENGINE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #07090e; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 14px; }
        .dashboard { width: 100%; max-width: 440px; background: #0b0f19; border: 1px solid #1e293b; border-radius: 18px; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.85); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 14px; }
        .brand { font-size: 14px; font-weight: 900; color: #38bdf8; letter-spacing: 1px; }
        .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; display: inline-block; margin-right: 6px; }
        
        .chart-box { width: 100%; height: 180px; background: #030712; border: 1px solid #1f2937; border-radius: 12px; position: relative; margin-bottom: 14px; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        .price-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; padding: 0 4px; }
        .curr-price { font-size: 28px; font-weight: 900; letter-spacing: 1px; color: #f8fafc; }
        .pair-badge { font-size: 11px; font-weight: 800; background: #1e293b; color: #38bdf8; padding: 4px 10px; border-radius: 8px; }

        .sig-card { border-radius: 14px; padding: 16px; text-align: center; border: 2px solid #334155; background: #111827; margin-bottom: 14px; }
        .sig-status { font-size: 32px; font-weight: 900; letter-spacing: 2px; }
        .sig-detail { font-size: 11px; font-weight: 700; margin-top: 4px; color: #94a3b8; }
        
        .CALL { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.12); box-shadow: 0 0 25px rgba(34, 197, 94, 0.25); }
        .PUT { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.12); box-shadow: 0 0 25px rgba(239, 68, 68, 0.25); }
        .WAIT { border-color: #334155; color: #94a3b8; }

        .quant-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
        .quant-cell { background: #141b2d; border: 1px solid #1e293b; padding: 10px 8px; border-radius: 10px; text-align: center; }
        .q-lbl { font-size: 10px; color: #64748b; font-weight: 800; }
        .q-val { font-size: 14px; font-weight: 900; margin-top: 3px; color: #f8fafc; }

        .ctrl-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div class="brand">⚡ CYBORG NUMERIC QUANT</div>
        <div style="font-size: 11px; font-weight: 700;"><span class="live-dot"></span>LIVE ENGINE</div>
    </div>

    <div class="price-row">
        <div>
            <div class="curr-price" id="priceDisplay">1.08420</div>
        </div>
        <div class="pair-badge" id="pairLabel">EUR/USD (OTC/LIVE)</div>
    </div>

    <div class="chart-box">
        <canvas id="candleCanvas"></canvas>
    </div>

    <div class="sig-card WAIT" id="sigCard">
        <div class="sig-status" id="sigStatus">ANALYZING</div>
        <div class="sig-detail" id="sigDetail">WAITING FOR REJECTION CONFIRMATION</div>
    </div>

    <div class="quant-grid">
        <div class="quant-cell">
            <div class="q-lbl">RSI (14)</div>
            <div class="q-val" id="rsiVal">48.2</div>
        </div>
        <div class="quant-cell">
            <div class="q-lbl">WICK PRESSURE</div>
            <div class="q-val" id="wickVal">0.0x</div>
        </div>
        <div class="quant-cell">
            <div class="q-lbl">CANDLE TYPE</div>
            <div class="q-val" id="typeVal">DOJI</div>
        </div>
    </div>

    <button class="ctrl-btn" onclick="toggleAudio()">🔊 Audio Signals: Active</button>
</div>

<script>
    let audioAllowed = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function triggerAlertSound(type) {
        if (!audioAllowed) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = type === "CALL" ? 880 : 380;
        osc.start();
        setTimeout(() => osc.stop(), 250);
    }
    function toggleAudio() {
        audioAllowed = !audioAllowed;
        event.target.innerText = audioAllowed ? "🔊 Audio Signals: Active" : "🔇 Audio Muted";
    }

    // Mathematical Engine Variables
    let currentPrice = 1.08420;
    let candles = [];
    let prices = [];
    let activeCandle = { open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice, ticks: 0 };

    // Canvas Setup
    const canvas = document.getElementById("candleCanvas");
    const ctx = canvas.getContext("2d");
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // RSI Calculation Formula (Period 14)
    function calcRSI(prices, period = 14) {
        if (prices.length < period + 1) return 50.0;
        let gains = 0, losses = 0;
        for (let i = prices.length - period; i < prices.length; i++) {
            let diff = prices[i] - prices[i - 1];
            if (diff >= 0) gains += diff;
            else losses -= diff;
        }
        if (losses === 0) return 100.0;
        let rs = (gains / period) / (losses / period);
        return 100 - (100 / (1 + rs));
    }

    // Live Tick Simulation & Candle Aggregator
    setInterval(() => {
        let delta = (Math.random() - 0.495) * 0.00018;
        currentPrice = parseFloat((currentPrice + delta).toFixed(5));
        document.getElementById("priceDisplay").innerText = currentPrice.toFixed(5);

        prices.push(currentPrice);
        if (prices.length > 80) prices.shift();

        // Update active candle
        activeCandle.high = Math.max(activeCandle.high, currentPrice);
        activeCandle.low = Math.min(activeCandle.low, currentPrice);
        activeCandle.close = currentPrice;
        activeCandle.ticks++;

        // Candle Close cycle (every 25 ticks creates 1 completed candle)
        if (activeCandle.ticks >= 25) {
            candles.push({ ...activeCandle });
            if (candles.length > 18) candles.shift();
            activeCandle = { open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice, ticks: 0 };
        }

        runMathCalculations();
        drawChart();
    }, 400);

    function runMathCalculations() {
        const rsi = calcRSI(prices, 14);
        document.getElementById("rsiVal").innerText = rsi.toFixed(1);

        // Candle Math: Body & Wicks
        const body = Math.abs(activeCandle.close - activeCandle.open);
        const upperWick = activeCandle.high - Math.max(activeCandle.open, activeCandle.close);
        const lowerWick = Math.min(activeCandle.open, activeCandle.close) - activeCandle.low;

        let wickRatio = 0;
        if (body > 0) {
            wickRatio = (lowerWick > upperWick ? lowerWick : upperWick) / body;
        }
        document.getElementById("wickVal").innerText = wickRatio.toFixed(1) + "x";

        let candleType = activeCandle.close >= activeCandle.open ? "BULL" : "BEAR";
        if (body < 0.00003) candleType = "DOJI";
        document.getElementById("typeVal").innerText = candleType;

        // Signal Logic Execution
        const sigCard = document.getElementById("sigCard");
        const sigStatus = document.getElementById("sigStatus");
        const sigDetail = document.getElementById("sigDetail");

        // CALL Condition: Oversold + Lower rejection wick > 1.4x body
        if (rsi <= 32 && lowerWick > body * 1.4 && lowerWick > 0.00004) {
            if (sigCard.className !== "sig-card CALL") triggerAlertSound("CALL");
            sigCard.className = "sig-card CALL";
            sigStatus.innerText = "CALL (BUY)";
            sigDetail.innerText = `OVERSOLD (RSI: ${rsi.toFixed(1)}) + BUYER REJECTION (${wickRatio.toFixed(1)}x)`;
        } 
        // PUT Condition: Overbought + Upper rejection wick > 1.4x body
        else if (rsi >= 68 && upperWick > body * 1.4 && upperWick > 0.00004) {
            if (sigCard.className !== "sig-card PUT") triggerAlertSound("PUT");
            sigCard.className = "sig-card PUT";
            sigStatus.innerText = "PUT (SELL)";
            sigDetail.innerText = `OVERBOUGHT (RSI: ${rsi.toFixed(1)}) + SELLER REJECTION (${wickRatio.toFixed(1)}x)`;
        } 
        else {
            sigCard.className = "sig-card WAIT";
            sigStatus.innerText = "WAITING";
            sigDetail.innerText = `RSI: ${rsi.toFixed(1)} • MARKET IN NORMAL RANGE`;
        }
    }

    function drawChart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const displayCandles = [...candles, activeCandle];
        if (displayCandles.length === 0) return;

        let minPrice = Math.min(...displayCandles.map(c => c.low));
        let maxPrice = Math.max(...displayCandles.map(c => c.high));
        let pad = (maxPrice - minPrice) * 0.1 || 0.0001;
        minPrice -= pad;
        maxPrice += pad;

        const getY = (val) => canvas.height - ((val - minPrice) / (maxPrice - minPrice)) * canvas.height;
        const candleWidth = Math.max(6, (canvas.width / (displayCandles.length + 2)) - 6);

        displayCandles.forEach((c, i) => {
            const x = (i + 1) * (candleWidth + 6);
            const yOpen = getY(c.open);
            const yClose = getY(c.close);
            const yHigh = getY(c.high);
            const yLow = getY(c.low);
            const isBull = c.close >= c.open;

            ctx.strokeStyle = isBull ? "#22c55e" : "#ef4444";
            ctx.fillStyle = isBull ? "#22c55e" : "#ef4444";

            // Wick
            ctx.beginPath();
            ctx.moveTo(x, yHigh);
            ctx.lineTo(x, yLow);
            ctx.stroke();

            // Body
            const top = Math.min(yOpen, yClose);
            const h = Math.max(2, Math.abs(yClose - yOpen));
            ctx.fillRect(x - candleWidth / 2, top, candleWidth, h);
        });
    }
</script>
</body>
</html>
