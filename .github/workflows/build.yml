name: Build Cyborg Sniper APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Android App Code
        run: |
          mkdir -p app/src/main/java/com/cyborg/sniper
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CyborgSniper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.cyborg.sniper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cyborg.sniper"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="Cyborg Sniper"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CyborgService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Cyborg Sniper</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/cyborg/sniper/MainActivity.java
          package com.cyborg.sniper;
          import android.app.Activity;
          import android.content.Intent;
          import android.media.projection.MediaProjectionManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int REQ_OVERLAY = 1001;
              private static final int REQ_PROJ = 1002;
              private MediaProjectionManager mpm;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  mpm = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setBackgroundColor(0xFF090D16);
                  l.setGravity(Gravity.CENTER);
                  l.setPadding(30, 30, 30, 30);

                  TextView tv = new TextView(this);
                  tv.setText("⚡ CYBORG SNIPER OTC");
                  tv.setTextColor(0xFF00F0FF);
                  tv.setTextSize(20);
                  tv.setGravity(Gravity.CENTER);
                  l.addView(tv);

                  Button b = new Button(this);
                  b.setText("START OVERLAY SCANNER");
                  b.setBackgroundColor(0xFF0284C7);
                  b.setTextColor(0xFFFFFFFF);
                  b.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())), REQ_OVERLAY);
                      } else {
                          startActivityForResult(mpm.createScreenCaptureIntent(), REQ_PROJ);
                      }
                  });
                  l.addView(b);
                  setContentView(l);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_OVERLAY) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && Settings.canDrawOverlays(this)) {
                          startActivityForResult(mpm.createScreenCaptureIntent(), REQ_PROJ);
                      }
                  } else if (req == REQ_PROJ && res == RESULT_OK && data != null) {
                      Intent i = new Intent(this, CyborgService.class);
                      i.putExtra("code", res);
                      i.putExtra("data", data);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i);
                      else startService(i);
                      finish();
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/cyborg/sniper/CyborgService.java
          package com.cyborg.sniper;
          import android.app.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.*;
          import android.media.*;
          import android.media.projection.*;
          import android.os.*;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.widget.*;
          import java.nio.ByteBuffer;

          public class CyborgService extends Service {
              private WindowManager wm;
              private View targetBox;
              private LinearLayout hud;
              private WindowManager.LayoutParams boxParams, hudParams;
              private MediaProjection proj;
              private VirtualDisplay vd;
              private ImageReader reader;
              private Handler h;
              private Runnable loop;
              private TextView tvSig;
              private Vibrator vib;
              private ToneGenerator tone;
              private long lastAlert = 0;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  vib = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  tone = new ToneGenerator(AudioManager.STREAM_MUSIC, 100);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel c = new NotificationChannel("c_bot", "Scanner", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(c);
                      Notification n = new Notification.Builder(this, "c_bot").setContentTitle("Cyborg Active").setSmallIcon(android.R.drawable.ic_menu_camera).build();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                      } else {
                          startForeground(101, n);
                      }
                  }

                  int type = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;

                  targetBox = new View(this);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0x00000000);
                  g.setStroke(3, 0xFF00F0FF);
                  targetBox.setBackground(g);

                  boxParams = new WindowManager.LayoutParams(120, 180, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT);
                  boxParams.gravity = Gravity.TOP | Gravity.LEFT;
                  boxParams.x = 400; boxParams.y = 600;
                  wm.addView(targetBox, boxParams);
                  drag(targetBox, boxParams);

                  hud = new LinearLayout(this);
                  hud.setOrientation(LinearLayout.VERTICAL);
                  hud.setPadding(16, 12, 16, 12);
                  GradientDrawable hg = new GradientDrawable();
                  hg.setColor(0xEE090D16);
                  hg.setCornerRadius(12);
                  hud.setBackground(hg);

                  tvSig = new TextView(this);
                  tvSig.setText("SCANNING...");
                  tvSig.setTextColor(0xFF00F0FF);
                  tvSig.setTextSize(16);
                  hud.addView(tvSig);

                  Button exit = new Button(this);
                  exit.setText("CLOSE");
                  exit.setTextSize(10);
                  exit.setOnClickListener(v -> stopSelf());
                  hud.addView(exit);

                  hudParams = new WindowManager.LayoutParams(260, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  hudParams.gravity = Gravity.TOP | Gravity.LEFT;
                  hudParams.x = 30; hudParams.y = 80;
                  wm.addView(hud, hudParams);
                  drag(hud, hudParams);
              }

              private void drag(View v, WindowManager.LayoutParams p) {
                  v.setOnTouchListener(new View.OnTouchListener() {
                      int ix, iy; float tx, ty;
                      @Override public boolean onTouch(View view, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN: ix = p.x; iy = p.y; tx = e.getRawX(); ty = e.getRawY(); return true;
                              case MotionEvent.ACTION_MOVE: p.x = ix + (int)(e.getRawX() - tx); p.y = iy + (int)(e.getRawY() - ty); wm.updateViewLayout(v, p); return true;
                          }
                          return false;
                      }
                  });
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && proj == null) {
                      MediaProjectionManager m = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                      proj = m.getMediaProjection(intent.getIntExtra("code", 0), intent.getParcelableExtra("data"));
                      startScan();
                  }
                  return START_NOT_STICKY;
              }

              private void startScan() {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int w = dm.widthPixels / 2; int hH = dm.heightPixels / 2;
                  reader = ImageReader.newInstance(w, hH, PixelFormat.RGBA_8888, 2);
                  vd = proj.createVirtualDisplay("c_cap", w, hH, dm.densityDpi / 2, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, null);

                  h = new Handler(Looper.getMainLooper());
                  loop = new Runnable() {
                      @Override public void run() {
                          scan(w, hH, dm.widthPixels, dm.heightPixels);
                          h.postDelayed(this, 300);
                      }
                  };
                  h.postDelayed(loop, 500);
              }

              private void scan(int w, int hH, int rw, int rh) {
                  Image img = reader.acquireLatestImage();
                  if (img == null) return;
                  try {
                      Image.Plane pl = img.getPlanes()[0];
                      ByteBuffer buf = pl.getBuffer();
                      int pS = pl.getPixelStride();
                      int rS = pl.getRowStride();
                      float sx = (float)w / rw; float sy = (float)hH / rh;

                      int sxP = Math.max(0, (int)(boxParams.x * sx));
                      int syP = Math.max(0, (int)(boxParams.y * sy));
                      int exP = Math.min(w, sxP + (int)(boxParams.width * sx));
                      int eyP = Math.min(hH, syP + (int)(boxParams.height * sy));

                      int gC = 0, rC = 0;
                      for (int y = syP; y < eyP; y += 3) {
                          int row = y * rS;
                          for (int x = sxP; x < exP; x += 3) {
                              int o = row + (x * pS);
                              int r = buf.get(o) & 0xFF;
                              int g = buf.get(o+1) & 0xFF;
                              int b = buf.get(o+2) & 0xFF;
                              if (g > 110 && g > r * 1.25) gC++;
                              else if (r > 120 && r > g * 1.3) rC++;
                          }
                      }

                      long now = System.currentTimeMillis();
                      if (gC > rC * 1.6 && gC > 20) {
                          tvSig.setText("CALL (BUY)");
                          tvSig.setTextColor(0xFF00FF88);
                          if (now - lastAlert > 8000) { tone.startTone(ToneGenerator.TONE_PROP_BEEP, 200); vib.vibrate(150); lastAlert = now; }
                      } else if (rC > gC * 1.6 && rC > 20) {
                          tvSig.setText("PUT (SELL)");
                          tvSig.setTextColor(0xFFFF3366);
                          if (now - lastAlert > 8000) { tone.startTone(ToneGenerator.TONE_PROP_BEEP2, 300); vib.vibrate(250); lastAlert = now; }
                      } else {
                          tvSig.setText("MONITORING");
                          tvSig.setTextColor(0xFF94A3B8);
                      }
                  } catch(Exception ignored) {} finally { img.close(); }
              }

              @Override public void onDestroy() {
                  super.onDestroy();
                  if (h != null) h.removeCallbacks(loop);
                  if (vd != null) vd.release();
                  if (reader != null) reader.close();
                  if (proj != null) proj.stop();
                  if (targetBox != null) wm.removeView(targetBox);
                  if (hud != null) wm.removeView(hud);
              }
          }
          EOF

      - name: Build Android APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyborg-Sniper-APK
          path: app/build/outputs/apk/debug/app-debug.apk